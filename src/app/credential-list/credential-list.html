<section aria-labelledby="credential-list-heading">
  <h1 id="credential-list-heading" class="list-heading">Credentials</h1>

  @if (count() === 0) {
    <mat-card data-empty-state class="empty-state">
      <mat-card-content>
        <p>Your vault is empty.</p>
      </mat-card-content>
    </mat-card>
  } @else {
    <mat-nav-list aria-label="Saved credentials">
      @for (credential of credentials(); track credential.id) {
        <div class="credential-row">
          <a
            mat-list-item
            class="row-link"
            [routerLink]="['/credentials', credential.id]"
            href="/credentials/{{ credential.id }}"
          >
            <span matListItemTitle class="row-title">
              <span data-credential-name>{{ credential.name }}</span>
              @if (credential.favorite) {
                <span
                  data-favorite
                  class="favorite"
                  role="img"
                  aria-label="Favorite credential"
                  >★</span
                >
              }
            </span>
            <span matListItemLine>{{ credential.username }}</span>
            <span matListItemMeta>{{ credential.domain }}</span>
          </a>
          <button
            type="button"
            mat-icon-button
            (click)="requestDelete(credential)"
            aria-label="Delete {{ credential.name }}"
          >
            <svg
              aria-hidden="true"
              focusable="false"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"
              />
            </svg>
          </button>
        </div>
      }
    </mat-nav-list>
  }
</section>
